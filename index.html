<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Révisions</title>

  <!-- Le manifeste sert à installer l'app sur le téléphone (icône, nom, plein écran). -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#123f4f">
  <link rel="icon" href="icones/icone-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header id="barre-haut">
    <button id="bouton-retour" class="icone" hidden>←</button>
    <h1 id="titre-ecran">Révisions</h1>
    <span id="etat-hors-ligne" title="Fonctionne hors ligne"></span>
  </header>

  <!-- Tout l'affichage se fait ici : chaque écran remplace le contenu de <main>. -->
  <main id="ecran"></main>

  <nav id="barre-bas">
    <button data-ecran="accueil" class="onglet actif">Accueil</button>
    <button data-ecran="paquets" class="onglet">Paquets</button>
    <button data-ecran="stats" class="onglet">Suivi</button>
    <button data-ecran="reglages" class="onglet">Réglages</button>
  </nav>

  <!-- Ordre important : chaque fichier utilise les précédents. -->
  <script src="js/fsrs.js"></script>
  <script src="js/donnees.js"></script>
  <script src="js/planification.js"></script>
  <script src="js/sauvegarde.js"></script>
  <script src="js/session.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
